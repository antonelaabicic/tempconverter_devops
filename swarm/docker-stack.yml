services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tempconverter
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - appnet
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  app:
    image: docker.io/aabici11/tempconverter:dev
    ports:
      - "80:5000"
    environment:
      DB_HOST: db
      DB_NAME: tempconverter
      DB_USER: user
      DB_PASS: password
      STUDENT: Antonela Abicic
      COLLEGE: Algebra University College
    networks:
      - appnet
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

networks:
  appnet:
    driver: overlay

volumes:
  mysql-data: